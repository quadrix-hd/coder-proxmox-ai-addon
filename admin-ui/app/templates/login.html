<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Login · Go live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e3e5e9;
      --text: #1a1d23;
      --text-muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0fe;
      --danger: #dc2626;
      --danger-soft: #fdecec;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.25rem;
      width: 100%;
      max-width: 360px;
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.1rem; margin-bottom: 1.75rem; }
    .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .error {
      background: var(--danger-soft);
      color: var(--danger);
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1.1rem;
      font-size: 0.88rem;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    input[type=password] {
      width: 100%;
      font-size: 0.95rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
    }
    input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button {
      width: 100%;
      margin-top: 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><span class="dot"></span>Go live - Admin</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
